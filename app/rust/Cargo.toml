[package]
name = "anvil_bridge"
description = "The app's way into anvil-app: what flutter_rust_bridge turns into Dart."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
anvil-app   = { workspace = true }
anvil-core  = { workspace = true }
anvil-fcp   = { workspace = true }
anvil-audio = { workspace = true }
anvil-update = { workspace = true }
tokio       = { workspace = true }
anyhow      = { workspace = true }
parking_lot = { workspace = true }
tracing     = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
