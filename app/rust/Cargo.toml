[package]
name = "anvil_bridge"
description = "The app's way into anvil-app: what flutter_rust_bridge turns into Dart."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
anvil-app   = { workspace = true }
anvil-core  = { workspace = true }
anvil-fcp   = { workspace = true }
anvil-audio = { workspace = true }
anvil-update = { workspace = true }
tokio       = { workspace = true }
anyhow      = { workspace = true }
parking_lot = { workspace = true }
tracing     = { workspace = true }

# A phone's model for the name it signs in under (src/device.rs).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# Below 0.2.190, which declares `_dyld_*` for macOS only: backtrace 0.3.76
# (under flutter_rust_bridge) calls them on iOS too and stops compiling.
libc = ">=0.2.150, <0.2.190"

[target.'cfg(target_os = "android")'.dependencies]
# The JVM and context cpal's Android backend needs (src/android.rs); the
# versions cpal 0.15 uses.
jni         = "0.21"
ndk-context = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
