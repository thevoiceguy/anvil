[workspace]
resolver = "2"
members = [
    "crates/anvil-core",
    "crates/anvil-audio",
    "crates/anvil-video",
    "crates/anvil-brand",
    "crates/anvil-codec",
    "crates/anvil-ffi",
    "crates/anvil-fcp",
    "crates/anvil-app",
    "crates/anvil-update",
    "app/rust",
    "bins/anvil-cli",
]

[workspace.package]
version = "0.2.110"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
authors = ["Anvil contributors"]
repository = "https://github.com/feryx-io/anvil"
homepage = "https://github.com/feryx-io/anvil"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Error handling
thiserror = "1"
anyhow = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Collections / sync
dashmap = "5"
parking_lot = "0.12"
bytes = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio I/O
cpal = "0.15"

# Codec
opus = "0.3"

# siphon-rs (SIP stack) — from crates.io (siphon-rs v2026.11.22.1). The crates
# were published as `siphon-*`; `package` keeps the `sip_*` names the code uses.
sip-core = { package = "siphon-core", version = "0.7.8" }
sip-parse = { package = "siphon-parse", version = "0.4.0" }
sip-transport = { package = "siphon-transport", version = "0.7.2", features = ["tls"] }
sip-transaction = { package = "siphon-transaction", version = "0.9.1" }
sip-dialog = { package = "siphon-dialog", version = "0.4.0" }
sip-uac = { package = "siphon-uac", version = "0.9.6" }
sip-uas = { package = "siphon-uas", version = "0.5.2" }
sip-sdp = { package = "siphon-sdp", version = "0.3.2" }
sip-auth = { package = "siphon-auth", version = "0.4.0" }
sip-dns = { package = "siphon-dns", version = "0.3.0" }

# forge-media — pinned to a release tag
forge-rtp = { git = "https://github.com/feryx-io/forge-media", tag = "v2026.11.22" }
forge-core = { git = "https://github.com/feryx-io/forge-media", tag = "v2026.11.22" }
forge-codecs = { git = "https://github.com/feryx-io/forge-media", tag = "v2026.11.22", features = ["g722"] }
forge-dtmf = { git = "https://github.com/feryx-io/forge-media", tag = "v2026.11.22" }
forge-resampler = { git = "https://github.com/feryx-io/forge-media", tag = "v2026.11.22" }
forge-bwe = { git = "https://github.com/feryx-io/forge-media", tag = "v2026.11.22" }

# Internal
anvil-core  = { path = "crates/anvil-core"  }
anvil-audio = { path = "crates/anvil-audio" }
anvil-video = { path = "crates/anvil-video" }
anvil-brand = { path = "crates/anvil-brand" }
anvil-codec = { path = "crates/anvil-codec" }
anvil-fcp   = { path = "crates/anvil-fcp"   }
anvil-app   = { path = "crates/anvil-app"   }
anvil-update = { path = "crates/anvil-update" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

