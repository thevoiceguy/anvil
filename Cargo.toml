[workspace]
resolver = "2"
members = [
    "crates/anvil-core",
    "crates/anvil-audio",
    "crates/anvil-brand",
    "crates/anvil-codec",
    "crates/anvil-ffi",
    "crates/anvil-fcp",
    "bins/anvil-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
authors = ["Anvil contributors"]
repository = "https://github.com/thevoiceguy/anvil"
homepage = "https://github.com/thevoiceguy/anvil"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Error handling
thiserror = "1"
anyhow = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Collections / sync
dashmap = "5"
parking_lot = "0.12"
bytes = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio I/O
cpal = "0.15"

# Codec
opus = "0.3"

# siphon-rs (SIP stack) — pinned to a release tag
sip-core = { git = "https://github.com/thevoiceguy/siphon-rs", tag = "v2026.10.07" }
sip-parse = { git = "https://github.com/thevoiceguy/siphon-rs", tag = "v2026.10.07" }
sip-transport = { git = "https://github.com/thevoiceguy/siphon-rs", tag = "v2026.10.07", features = ["tls"] }
sip-transaction = { git = "https://github.com/thevoiceguy/siphon-rs", tag = "v2026.10.07" }
sip-dialog = { git = "https://github.com/thevoiceguy/siphon-rs", tag = "v2026.10.07" }
sip-uac = { git = "https://github.com/thevoiceguy/siphon-rs", tag = "v2026.10.07" }
sip-uas = { git = "https://github.com/thevoiceguy/siphon-rs", tag = "v2026.10.07" }
sip-sdp = { git = "https://github.com/thevoiceguy/siphon-rs", tag = "v2026.10.07" }
sip-auth = { git = "https://github.com/thevoiceguy/siphon-rs", tag = "v2026.10.07" }
sip-dns = { git = "https://github.com/thevoiceguy/siphon-rs", tag = "v2026.10.07" }

# forge-media — pinned to a release tag
forge-rtp = { git = "https://github.com/thevoiceguy/forge-media", tag = "v2026.10.07" }
forge-codecs = { git = "https://github.com/thevoiceguy/forge-media", tag = "v2026.10.07", features = ["g722"] }
forge-dtmf = { git = "https://github.com/thevoiceguy/forge-media", tag = "v2026.10.07" }
forge-resampler = { git = "https://github.com/thevoiceguy/forge-media", tag = "v2026.10.07" }

# Internal
anvil-core  = { path = "crates/anvil-core"  }
anvil-audio = { path = "crates/anvil-audio" }
anvil-brand = { path = "crates/anvil-brand" }
anvil-codec = { path = "crates/anvil-codec" }
anvil-fcp   = { path = "crates/anvil-fcp"   }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

