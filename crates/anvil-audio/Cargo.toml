[package]
name = "anvil-audio"
description = "Cross-platform microphone and speaker I/O for Anvil, backed by cpal."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true

[features]
default = ["cpal-default"]
cpal-default = ["dep:cpal", "dep:forge-resampler"]
# Link webrtc-audio-processing for AEC / NS / AGC. Off by default because
# it's a C++ build; turn it on for desktop / Linux where it's reliable.
apm = []
# Tone-generator audio host, handy for headless end-to-end tests.
tone = []

[dependencies]
anvil-core  = { workspace = true }
tokio       = { workspace = true }
async-trait = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
parking_lot = { workspace = true }
cpal        = { workspace = true, optional = true }
# Resampling from device rate (typically 48 kHz) to G.711 8 kHz.
forge-resampler = { workspace = true, optional = true }

# The default device for calls (`comms.rs`), through the windows crate
# cpal already uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_Devices_Properties"] }
