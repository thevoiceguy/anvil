[package]
name = "anvil-video"
description = "The desktop's camera, codecs and screen for Anvil's video calls."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true

[dependencies]
anvil-core  = { workspace = true }
tokio       = { workspace = true }
async-trait = { workspace = true }
tracing     = { workspace = true }
parking_lot = { workspace = true }
bytes       = { workspace = true }
# H.264 through Cisco's OpenH264 binary, loaded at run time: only Cisco's
# binary carries Cisco's patent licence, so it is downloaded at first use
# (as Firefox does) and never built from source here (no `source`).
openh264      = { version = "0.9", default-features = false, features = ["libloading"] }
openh264-sys2 = { version = "0.9", default-features = false, features = ["libloading"] }
bzip2   = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
sha2    = "0.10"

# Linux: V4L2 cameras, VP8 through libvpx (BSD, no royalties), its
# bindings made by build.rs from the installed headers; screens from the
# X server through x11rb (the protocol in Rust: no library to install).
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", default-features = false, features = ["randr"] }
v4l            = "0.14"
zune-jpeg      = "0.5"

# macOS: H.264 through VideoToolbox (the system's codec, in hardware where
# the Mac has it); cameras through AVFoundation.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-core-foundation = "0.3"
objc2-core-media      = "0.3"
objc2-core-video      = "0.3"
objc2-video-toolbox   = "0.3"
objc2                 = "0.6"
objc2-foundation      = "0.3"
objc2-av-foundation   = "0.3"
dispatch2             = "0.3"
block2                = "0.6"

# Windows: H.264 through Media Foundation (Windows' licence covers it).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Variant",
] }

# Android: cameras through Camera2 and H.264 and VP8 through MediaCodec,
# both the NDK's.
[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = { version = "0.5", features = ["media"] }

[build-dependencies]
bindgen    = "0.72"
pkg-config = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
anvil-audio = { workspace = true, features = ["tone"] }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "android")'.dev-dependencies]
libloading = "0.8"
