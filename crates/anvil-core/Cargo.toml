[package]
name = "anvil-core"
description = "Cross-platform softphone core: orchestrates siphon-rs signaling and forge-media."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true

[features]
default = ["tls"]
tls  = ["dep:rustls", "dep:tokio-rustls", "dep:webpki-roots", "dep:rustls-pemfile"]
srtp = []

[dependencies]
tokio        = { workspace = true }
async-trait  = { workspace = true }
futures      = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
bytes        = { workspace = true }
dashmap      = { workspace = true }
parking_lot  = { workspace = true }
serde        = { workspace = true }

# SIP stack
sip-core        = { workspace = true }
sip-parse       = { workspace = true }
sip-transport   = { workspace = true }
sip-transaction = { workspace = true }
sip-dialog      = { workspace = true }
sip-uac         = { workspace = true }
sip-uas         = { workspace = true }
sip-sdp         = { workspace = true }
sip-auth        = { workspace = true }
sip-dns         = { workspace = true }

# Media engine
forge-rtp    = { workspace = true }
forge-codecs = { workspace = true }
forge-dtmf   = { workspace = true }

anyhow = { workspace = true }
rand   = "0.8"
opus   = { workspace = true }

# TLS client. Pinned to the same versions sip-transport uses to avoid
# rustls duplication via cargo's resolver.
rustls         = { version = "0.23", default-features = false, features = ["std", "ring"], optional = true }
tokio-rustls   = { version = "0.26", default-features = false, features = ["ring"],        optional = true }
webpki-roots   = { version = "0.26", optional = true }
rustls-pemfile = { version = "2",    optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = { workspace = true }
rand = "0.8"
