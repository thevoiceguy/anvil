[package]
name = "anvil-app"
description = "The running phone: one state model and one stream of changes over anvil-core and anvil-fcp, the commands that drive it, and the local control socket the CLI and the app use."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true

[dependencies]
anvil-core = { workspace = true }
anvil-fcp  = { workspace = true }
tokio      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
parking_lot = { workspace = true }
dirs       = "5"
# When a recent call started, against when the recents were cleared.
chrono     = { version = "0.4", default-features = false, features = ["std"] }
# A brand's ringtones: Ogg Vorbis and MP3 (WAV is read by `clip`).
symphonia  = { version = "0.5.5", default-features = false, features = ["ogg", "vorbis", "mp3"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Registry", "Win32_Security_Authentication_Identity"] }


# Managed preferences from a configuration profile (`managed.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

# The brand on the system (`system_brand.rs`): the icon files made from the
# brand's PNG, JPEG or WebP image, named by their hash.
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg", "webp", "ico"]

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies.sha2]
version = "0.10"

# The shortcuts Anvil's installer made, renamed and re-iconed (IShellLinkW).
[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"]

# A desktop also trusts the system's own certificates: a company's
# internal CA, a TLS-inspecting proxy (the phones keep the bundled ones).
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }

[dev-dependencies]
async-trait = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rand    = "0.8"
# Seeds a voicemail message into FCP's database (ANVIL_FCP_DATABASE_URL):
# FCP's API has no way to leave one.
tokio-postgres = "0.7"
