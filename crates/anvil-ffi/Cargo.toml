[package]
name = "anvil-ffi"
description = "C ABI surface for Anvil. Consumed by iOS / Android / native UI hosts."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true

[lib]
# Static + dynamic so hosts can pick whichever linkage they need:
#   iOS .xcframework wants staticlib, Android wants cdylib, Windows DLL wants cdylib.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde_json = { workspace = true }
serde      = { workspace = true }
anvil-core  = { workspace = true }
anvil-fcp   = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }


# A desktop also trusts the system's own certificates: a company's
# internal CA, a TLS-inspecting proxy (the phones keep the bundled ones).
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rand    = "0.8"

[build-dependencies]
cbindgen = "0.27"
