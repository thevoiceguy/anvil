language = "C"
header = """
/* Generated by cbindgen — do not edit by hand.
 *
 * Anvil — cross-platform softphone C ABI.
 * See https://github.com/thevoiceguy/anvil
 */
"""
include_guard = "ANVIL_H"
pragma_once = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h", "stdbool.h"]
cpp_compat = true
braces = "SameLine"
line_length = 100
tab_width = 4
documentation = true
documentation_style = "doxy"
style = "tag"

[export]
prefix = "Anvil"
item_types = ["enums", "structs", "opaque", "functions", "constants", "typedefs"]
renaming_overrides_prefixing = true

[export.rename]
# Don't double-prefix the structs that already have Anvil in their name.
"AnvilHandle" = "AnvilHandle"
"AnvilStatus" = "AnvilStatus"
"AnvilTransport" = "AnvilTransport"
"AnvilConfigC" = "AnvilConfig"

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"
