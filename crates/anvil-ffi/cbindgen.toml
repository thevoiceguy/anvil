language = "C"
header = """
/* Generated by cbindgen — do not edit by hand.
 *
 * Anvil — cross-platform softphone C ABI.
 * See https://github.com/thevoiceguy/anvil
 */
"""
include_guard = "ANVIL_H"
pragma_once = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h", "stdbool.h"]
cpp_compat = true
braces = "SameLine"
line_length = 100
tab_width = 4
documentation = true
documentation_style = "doxy"
style = "tag"

[export]
# All types already start with `Anvil` in Rust, so no `prefix` here —
# adding one yields `AnvilAnvilEvent`. Just rename the trailing `C`
# suffix on the config struct.
item_types = ["enums", "structs", "opaque", "functions", "constants", "typedefs"]

[export.rename]
"AnvilConfigC" = "AnvilConfig"

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"
