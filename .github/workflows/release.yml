name: Release

# A tag vX.Y.Z (the workspace's version) builds and publishes a GitHub
# release: anvil-cli for Windows (a zip), and the app's installers — a
# Windows setup, a macOS disk image, a Linux AppImage and .deb — each
# installed, started and removed again before it is published, with
# SHA256SUMS over the lot, and latest.json with its Ed25519 signature for
# the app's updater. Nothing is code-signed yet (docs/APP.md §5).
#
# A pull request that changes this file or the packaging builds and checks
# everything the same way without publishing it (the files are the run's
# artifacts), so the pipeline is proved before a tag needs it.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "app/packaging/**"
      - "app/linux/packaging/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: "3.47.6"

permissions:
  contents: write

jobs:
  version:
    name: The version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      label: ${{ steps.v.outputs.label }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='anvil-cli'))")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::tag $GITHUB_REF_NAME is not the workspace's version v$version"
              exit 1
            fi
            label=$GITHUB_REF_NAME
          else
            label=dev
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

  cli-windows:
    name: anvil-cli for Windows
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      # The C runtime linked in, so the exe runs without the Visual C++
      # redistributable installed.
      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p anvil-cli --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $name = "anvil-cli-${{ needs.version.outputs.label }}-windows-x86_64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/anvil-cli.exe $name/
          Copy-Item README.md $name/
          Get-ChildItem -Filter 'LICENSE*' | Copy-Item -Destination $name/
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path $name -DestinationPath "dist/$name.zip"
          # It runs: the exe answers --help.
          & "$name/anvil-cli.exe" --help | Select-Object -First 3

      - uses: actions/upload-artifact@v4
        with:
          name: release-cli-windows
          path: dist/

  app-linux:
    name: The app for Linux
    needs: version
    runs-on: ubuntu-latest
    env:
      APPIMAGETOOL: ${{ github.workspace }}/appimagetool
      APPIMAGE_RUNTIME: ${{ github.workspace }}/runtime-x86_64
      # appimagetool is itself an AppImage; runners have no FUSE.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> app/build"
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libasound2-dev libayatana-appindicator3-dev xvfb
      # Pinned by digest: appimagetool 1.9.1 and the type2 runtime 20251108.
      - name: appimagetool
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL -o runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          sha256sum -c <<SUMS
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime-x86_64
          SUMS
          chmod +x appimagetool
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build linux --release \
            --build-name ${{ needs.version.outputs.version }} --build-number ${{ github.run_number }}
      - name: Package
        run: app/packaging/linux.sh ${{ needs.version.outputs.version }} ${{ needs.version.outputs.label }} app/build/linux/x64/release/bundle dist
      # Installed as a user would, then started: it must still be running
      # ten seconds later (timeout's 124), then removed.
      - name: The .deb installs, starts and goes
        run: |
          sudo apt-get install -y ./dist/anvil_*_amd64.deb
          test -x /opt/anvil/anvil && command -v anvil
          ! ldd /opt/anvil/anvil /opt/anvil/lib/*.so | grep "not found"
          set +e; xvfb-run -a timeout 10 anvil; code=$?; set -e
          [ "$code" = 124 ] || { echo "::error::anvil exited with $code"; exit 1; }
          # A brand puts a menu entry of its own over the packaged one
          # (system_brand.rs); without one it goes.
          brand=$(mktemp -d)
          cp app/assets/app/anvil.png "$brand/icon.png"
          echo '{"brand": {"app_name": "Acme Voice", "icon": "icon.png"}}' > "$brand/profile.json"
          entry=~/.local/share/applications/com.thevoiceguy.anvil.desktop
          set +e; ANVIL_PROFILE="$brand" xvfb-run -a timeout 10 anvil; set -e
          grep -qx 'Name=Acme Voice' "$entry" || { echo "::error::no branded menu entry"; cat "$entry"; exit 1; }
          grep -q '^Icon=/.*/brand/icon-.*\.png$' "$entry" || { echo "::error::the entry's icon"; cat "$entry"; exit 1; }
          grep -qx 'Exec=anvil' "$entry"
          set +e; ANVIL_PROFILE="$(mktemp -d)" xvfb-run -a timeout 10 anvil; set -e
          test ! -e "$entry" || { echo "::error::the branded entry outlived the brand"; exit 1; }
          sudo apt-get remove -y anvil
          test ! -e /opt/anvil/anvil
      # A branded .deb (brand.py): the profile in /etc/anvil/profile and the
      # menu entry named from it; the app shows the brand; the stock package
      # over it keeps the profile (a conffile), and a purge takes it away.
      - name: A branded .deb installs the profile and keeps it
        run: |
          brand=$(mktemp -d)
          cp app/assets/app/anvil.png "$brand/icon.png"
          echo '{"profile_version": 1, "server": "https://voice.acme.example", "brand": {"app_name": "Acme Voice", "icon": "icon.png"}}' > "$brand/profile.json"
          deb=$(python3 app/packaging/brand.py "$brand" --bundle dist/anvil_${{ needs.version.outputs.label }}_amd64.deb \
            --version ${{ needs.version.outputs.version }} --label ${{ needs.version.outputs.label }} --out "$RUNNER_TEMP/branded" | tail -1)
          test "$(basename "$deb")" = "acme-voice_${{ needs.version.outputs.label }}_amd64.deb"
          sudo apt-get install -y "$deb"
          packaged=/usr/share/applications/com.thevoiceguy.anvil.desktop
          test -f /etc/anvil/profile/profile.json
          grep -qx 'Name=Acme Voice' "$packaged" || { cat "$packaged"; exit 1; }
          grep -qx 'Icon=/etc/anvil/profile/icon.png' "$packaged"
          entry=~/.local/share/applications/com.thevoiceguy.anvil.desktop
          rm -f "$entry"
          set +e; xvfb-run -a timeout 10 anvil; code=$?; set -e
          [ "$code" = 124 ] || { echo "::error::anvil exited with $code"; exit 1; }
          grep -qx 'Name=Acme Voice' "$entry" || { echo "::error::the app did not show the installed profile's brand"; exit 1; }
          sudo dpkg -i dist/anvil_${{ needs.version.outputs.label }}_amd64.deb
          grep -qx 'Name=Anvil' "$packaged"
          test -f /etc/anvil/profile/profile.json || { echo "::error::the stock package took the profile away"; exit 1; }
          sudo apt-get purge -y anvil
          test ! -e /etc/anvil/profile || { echo "::error::the purge left the profile"; exit 1; }
      - name: The AppImage starts
        run: |
          chmod +x dist/Anvil-*.AppImage
          set +e; xvfb-run -a timeout 10 dist/Anvil-*.AppImage; code=$?; set -e
          [ "$code" = 124 ] || { echo "::error::the AppImage exited with $code"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: release-app-linux
          path: dist/

  app-windows:
    name: The app for Windows
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> app/build"
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release --build-name ${{ needs.version.outputs.version }} --build-number ${{ github.run_number }}
      # Flutter's Windows apps need the Visual C++ runtime; it goes beside
      # the exe (app-local), so nobody has to install the redistributable.
      - name: The C++ runtime beside the app
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:SystemRoot\System32\$dll" app/build/windows/x64/runner/Release/
          }
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (-not (Test-Path "$iscc\ISCC.exe")) { choco install innosetup -y --no-progress }
            "${env:ProgramFiles(x86)}\Inno Setup 6" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }
      - name: Package
        working-directory: app/packaging
        shell: pwsh
        run: |
          iscc /Q "/DVersion=${{ needs.version.outputs.version }}" "/DLabel=${{ needs.version.outputs.label }}" `
            "/DBundle=$env:GITHUB_WORKSPACE\app\build\windows\x64\runner\Release" "/DOut=$env:GITHUB_WORKSPACE\dist" windows.iss
          # The app's files, for a company building a branded setup
          # (brand.py, docs/MANAGED_INSTALLS.md §2.3).
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\app\build\windows\x64\runner\Release\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\dist\Anvil-${{ needs.version.outputs.label }}-windows-x86_64-bundle.zip"
          Get-ChildItem $env:GITHUB_WORKSPACE\dist
      # Installed silently for this user, started (still running ten seconds
      # later), started again with a link (which hands it on and leaves),
      # stopped, and uninstalled with what it registered.
      - name: The installer installs, starts and goes
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/Anvil-*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $dir = "$env:LOCALAPPDATA\Programs\Anvil"
          if (-not (Test-Path "$dir\anvil.exe")) { throw "anvil.exe is not installed" }
          $open = (Get-ItemProperty 'HKCU:\Software\Classes\Anvil.Url\shell\open\command').'(default)'
          if ($open -notlike "*anvil.exe*%1*") { throw "links are not opened by Anvil: $open" }
          if ((Get-ItemProperty 'HKCU:\Software\RegisteredApplications').Anvil -ne 'Software\Anvil\Capabilities') {
            throw "Anvil is not offered in the default apps"
          }
          $p = Start-Process "$dir\anvil.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "anvil.exe exited with $($p.ExitCode)" }
          $second = Start-Process "$dir\anvil.exe" -ArgumentList 'tel:1002' -PassThru
          if (-not $second.WaitForExit(15000)) { throw "a second start kept running" }
          if ($p.HasExited) { throw "the first anvil.exe exited when a second started" }
          $data = "$env:LOCALAPPDATA\Anvil\Anvil"
          if (-not (Test-Path $data)) { throw "the app keeps nothing in the local profile ($data)" }
          # An update over the running app, as the app starts one
          # (crates/anvil-update/src/install.rs): the setup waits for the app
          # to go, runs silently, and starts it again. (Waited for as one
          # process: `Start-Process -Wait` waits for the app it relaunches too.)
          $wait = "Wait-Process -Id $($p.Id) -Timeout 30; Stop-Process -Id $($p.Id) -Force; " +
                  "(Start-Process -PassThru -FilePath '$($setup.FullName)' -ArgumentList " +
                  "'/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CLOSEAPPLICATIONS','/relaunch=1').WaitForExit()"
          $updater = Start-Process powershell.exe -ArgumentList '-NoProfile', '-NonInteractive', '-Command', $wait -PassThru
          Start-Sleep -Seconds 3
          Stop-Process -Id $p.Id -Force   # the app quitting for the update
          if (-not $updater.WaitForExit(180000)) { throw "the update did not finish" }
          Start-Sleep -Seconds 10
          $again = Get-Process anvil -ErrorAction SilentlyContinue
          if (-not $again) { throw "the app was not started again after the update" }
          if (-not (Test-Path "$dir\anvil.exe")) { throw "the update left no anvil.exe" }
          $again | Stop-Process -Force
          Start-Sleep -Seconds 2
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          Start-Sleep -Seconds 2
          if (Test-Path "$dir\anvil.exe") { throw "the uninstaller left anvil.exe" }
          if (Test-Path $data) { throw "the uninstaller left the app's files ($data)" }
          foreach ($key in 'HKCU:\Software\Classes\Anvil.Url', 'HKCU:\Software\Anvil',
                           'HKCU:\Software\Classes\AppUserModelId\Anvil.Softphone') {
            if (Test-Path $key) { throw "the uninstaller left $key" }
          }
          if ((Get-ItemProperty 'HKCU:\Software\RegisteredApplications' -ErrorAction SilentlyContinue).Anvil) {
            throw "the uninstaller left Anvil in the default apps"
          }
      # A company's install (docs/MANAGED_INSTALLS.md §2.3): the stock setup,
      # then the same setup given a profile and a field over it — the
      # shortcuts renamed with the brand's icon, the old one gone, the app id
      # and the uninstaller named, the app registering the same at its start
      # — then the stock setup again as the app updates itself, keeping it
      # all; a branded setup from brand.py renaming it again; a profile that
      # is not there failing the install; and the uninstaller taking it away.
      - name: A company's profile is installed, kept and removed, and the app renames it
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/Anvil-*-setup.exe | Select-Object -First 1).FullName
          $dir = "$env:LOCALAPPDATA\Programs\Anvil"
          $programs = [Environment]::GetFolderPath('Programs')
          $desktop = [Environment]::GetFolderPath('Desktop')
          $aumid = 'HKCU:\Software\Classes\AppUserModelId\Anvil.Softphone'
          # Where the app makes a brand's icons (system_brand.rs).
          $brand = "$env:LOCALAPPDATA\Anvil\Anvil\brand"
          $uninstall = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{B3F0D2A4-5C1E-4E8B-9A7D-3F6C2E1B0A95}_is1'
          function Run-Setup([string]$exe, [string[]]$more = @()) {
            $list = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\setup.log") + $more
            (Start-Process $exe -ArgumentList $list -Wait -PassThru).ExitCode
          }
          function Shortcut([string]$name) {
            $path = Join-Path $programs "$name.lnk"
            if (Test-Path -LiteralPath $path) { (New-Object -ComObject WScript.Shell).CreateShortcut($path) }
          }
          function Profile-Named([string]$name, [string]$color) {
            $p = Join-Path $env:RUNNER_TEMP ($name -replace ' ', '-')
            New-Item -ItemType Directory -Force $p | Out-Null
            Add-Type -AssemblyName System.Drawing
            $bmp = New-Object System.Drawing.Bitmap 512, 512
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromName($color))
            $g.Dispose()
            $bmp.Save("$p\icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
            @{ profile_version = 1; server = 'https://voice.acme.example'; login_domain = 'acme.example'
               brand = @{ app_name = $name; icon = 'icon.png' } } |
              ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "$p\profile.json"
            $p
          }
          function Expect([bool]$ok, [string]$what) {
            if (-not $ok) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40; throw $what }
          }
          # The app for ten seconds, given a profile of its own (as FCP's
          # brand would differ from the installed one), or none.
          function Run-App([string]$given = '') {
            if ($given) { $env:ANVIL_PROFILE = $given }
            $app = Start-Process "$dir\anvil.exe" -PassThru
            Start-Sleep -Seconds 10
            Remove-Item Env:ANVIL_PROFILE -ErrorAction SilentlyContinue
            Expect (-not $app.HasExited) "anvil.exe exited"
            Stop-Process -Id $app.Id -Force
            Start-Sleep -Seconds 2
          }

          Expect ((Run-Setup $setup) -eq 0) "the stock install failed"
          Expect ($null -ne (Shortcut 'Anvil')) "the stock install made no Anvil shortcut"

          $acme = Profile-Named 'Acme Voice' 'DarkRed'
          Compress-Archive -Path "$acme\*" -DestinationPath "$env:RUNNER_TEMP\acme-profile.zip"
          Expect ((Run-Setup $setup @("/PROFILE=$env:RUNNER_TEMP\acme-profile.zip", '/SIGNIN=sso', '/TASKS=desktopicon')) -eq 0) "the install with a profile failed"
          $lnk = Shortcut 'Acme Voice'
          Expect ($null -ne $lnk) "no Acme Voice shortcut"
          Expect ($lnk.TargetPath -eq "$dir\anvil.exe") "the shortcut opens $($lnk.TargetPath)"
          Expect ($lnk.IconLocation -like "$dir\profile\icon.ico*") "the shortcut's icon is $($lnk.IconLocation)"
          Expect (Test-Path -LiteralPath "$desktop\Acme Voice.lnk") "no Acme Voice on the desktop"
          Expect ($null -eq (Shortcut 'Anvil')) "the Anvil shortcut was left beside the brand's"
          $profile = Get-Content -Raw "$dir\profile\profile.json" | ConvertFrom-Json
          Expect ($profile.server -eq 'https://voice.acme.example' -and $profile.login_domain -eq 'acme.example') "the profile's fields: $($profile | ConvertTo-Json -Compress)"
          Expect ($profile.sign_in -eq 'sso') "/SIGNIN= was not written over the profile"
          $ico = [IO.File]::ReadAllBytes("$dir\profile\icon.ico")
          Expect ($ico[0] -eq 0 -and $ico[1] -eq 0 -and $ico[2] -eq 1 -and $ico[3] -eq 0 -and $ico[4] -eq 4) "icon.ico is not an ICO of four images"
          Expect ((Get-ItemProperty $aumid).DisplayName -eq 'Acme Voice') "the app id is not named for the brand"
          Expect ((Get-ItemProperty $aumid).IconUri -eq "$dir\profile\icon.ico") "the app id has not the brand's icon"
          Expect ((Get-ItemProperty $uninstall).DisplayName -eq 'Acme Voice') "the uninstaller is named $((Get-ItemProperty $uninstall).DisplayName)"
          Expect ((Get-Content -Raw "$dir\profile\shortcuts.json") -like '*Acme Voice.lnk*') "shortcuts.json: $(Get-Content -Raw "$dir\profile\shortcuts.json")"

          # The app registers its app id at every start, and shows the
          # brand on the system from icons of its own: the brand's name and
          # icon, not Anvil's.
          Run-App
          Expect ((Get-ItemProperty $aumid).DisplayName -eq 'Acme Voice') "the app named its app id $((Get-ItemProperty $aumid).DisplayName)"
          Expect ((Get-ItemProperty $aumid).IconUri -like "$brand\icon-*.ico") "the app gave its app id the icon $((Get-ItemProperty $aumid).IconUri)"
          Expect ((Shortcut 'Acme Voice').IconLocation -like "$brand\icon-*.ico*") "the app left the shortcut's icon at $((Shortcut 'Acme Voice').IconLocation)"

          # The update: the stock setup, with nothing given.
          Expect ((Run-Setup $setup @('/relaunch=0')) -eq 0) "the update failed"
          Expect ($null -ne (Shortcut 'Acme Voice')) "the update lost the brand's shortcut"
          Expect ((Shortcut 'Acme Voice').IconLocation -like "$dir\profile\icon.ico*") "the update lost the brand's icon"
          Expect ($null -eq (Shortcut 'Anvil')) "the update put Anvil's shortcut back"
          Expect ((Get-Content -Raw "$dir\profile\profile.json" | ConvertFrom-Json).sign_in -eq 'sso') "the update changed the profile"

          # A branded setup over it.
          $beta = Profile-Named 'Beta Phone' 'Navy'
          python app/packaging/brand.py $beta --bundle app/build/windows/x64/runner/Release `
            --version ${{ needs.version.outputs.version }} --label ${{ needs.version.outputs.label }} --out "$env:RUNNER_TEMP\branded"
          if ($LASTEXITCODE) { throw "brand.py failed" }
          $branded = Get-Item "$env:RUNNER_TEMP\branded\Beta-Phone-${{ needs.version.outputs.label }}-windows-x86_64-setup.exe"
          Expect ((Run-Setup $branded.FullName) -eq 0) "the branded install failed"
          Expect ($null -ne (Shortcut 'Beta Phone')) "no Beta Phone shortcut"
          Expect ($null -eq (Shortcut 'Acme Voice')) "the renamed brand's shortcut was left"
          Expect (-not (Test-Path -LiteralPath "$desktop\Acme Voice.lnk")) "the renamed brand's desktop shortcut was left"
          Expect (Test-Path -LiteralPath "$desktop\Beta Phone.lnk") "no Beta Phone on the desktop"
          Expect ((Get-ItemProperty $aumid).DisplayName -eq 'Beta Phone') "the app id is not named for the branded setup's brand"
          Expect ($null -eq (Get-Content -Raw "$dir\profile\profile.json" | ConvertFrom-Json).sign_in) "the old profile's field outlived a new profile"

          # A profile that is not there fails the install and changes nothing.
          Expect ((Run-Setup $setup @('/PROFILE=C:\nowhere\profile.zip')) -ne 0) "a missing profile did not fail the install"
          Expect ($null -ne (Shortcut 'Beta Phone')) "a failed install touched the shortcuts"

          # Another brand at run time: the app renames the installer's
          # shortcuts and gives them its icon.
          Run-App (Profile-Named 'Gamma Line' 'DarkGreen')
          $lnk = Shortcut 'Gamma Line'
          Expect ($null -ne $lnk) "the app did not rename the shortcut for its brand"
          Expect ($lnk.TargetPath -eq "$dir\anvil.exe") "the renamed shortcut opens $($lnk.TargetPath)"
          Expect ($lnk.IconLocation -like "$brand\icon-*.ico*") "the renamed shortcut's icon is $($lnk.IconLocation)"
          Expect ($null -eq (Shortcut 'Beta Phone')) "the app left the old brand's shortcut"
          Expect (Test-Path -LiteralPath "$desktop\Gamma Line.lnk") "the app did not rename the desktop shortcut"
          Expect (-not (Test-Path -LiteralPath "$desktop\Beta Phone.lnk")) "the app left the old brand's desktop shortcut"
          Expect ((Get-ItemProperty $aumid).DisplayName -eq 'Gamma Line') "the app id is named $((Get-ItemProperty $aumid).DisplayName)"
          Expect ((Get-Content -Raw "$dir\profile\shortcuts.json") -like '*Gamma Line.lnk*') "shortcuts.json: $(Get-Content -Raw "$dir\profile\shortcuts.json")"

          # No brand at all: Anvil's name and the program's own icon.
          $none = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\no-profile"
          Run-App $none.FullName
          $lnk = Shortcut 'Anvil'
          Expect ($null -ne $lnk) "the app did not name the shortcut Anvil without a brand"
          Expect ($lnk.IconLocation -notlike "*\brand\*") "Anvil's shortcut kept the brand's icon: $($lnk.IconLocation)"
          Expect ($null -eq (Shortcut 'Gamma Line')) "the brand's shortcut was left"
          Expect ((Get-ItemProperty $aumid).DisplayName -eq 'Anvil') "the app id is named $((Get-ItemProperty $aumid).DisplayName)"
          Expect ($null -eq (Get-ItemProperty $aumid).IconUri) "the app id kept the brand's icon"

          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          Start-Sleep -Seconds 2
          Expect (-not (Test-Path "$dir\profile")) "the uninstaller left the profile"
          Expect ($null -eq (Shortcut 'Anvil')) "the uninstaller left the shortcut the app renamed"
          Expect (-not (Test-Path -LiteralPath "$desktop\Anvil.lnk")) "the uninstaller left the desktop shortcut the app renamed"
          Expect (-not (Test-Path $aumid)) "the uninstaller left the app id"
      - uses: actions/upload-artifact@v4
        with:
          name: release-app-windows
          path: dist/

  app-macos:
    name: The app for macOS
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> app/build"
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --release --build-name ${{ needs.version.outputs.version }} --build-number ${{ github.run_number }}
      - name: Package
        run: app/packaging/macos.sh ${{ needs.version.outputs.label }} app/build/macos/Build/Products/Release/Anvil.app dist
      # Mounted as a user would, and checked: the version, both
      # architectures, a valid (ad hoc) signature, and it starts.
      - name: The disk image holds the app, and it starts
        run: |
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -mountpoint "$mnt" dist/Anvil-*-macos.dmg
          app="$mnt/Anvil.app"
          test -L "$mnt/Applications"
          v=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")
          [ "$v" = "${{ needs.version.outputs.version }}" ] || { echo "::error::version $v"; exit 1; }
          lipo -archs "$app/Contents/MacOS/Anvil"
          codesign --verify --deep "$app"
          cp -R "$app" "$RUNNER_TEMP/"
          hdiutil detach "$mnt"
          "$RUNNER_TEMP/Anvil.app/Contents/MacOS/Anvil" & pid=$!
          sleep 10
          kill -0 $pid || { echo "::error::the app exited"; exit 1; }
          kill $pid
      # A branded .pkg (brand.py): the app renamed, with the brand's icon,
      # in /Applications and the profile where the app reads it.
      - name: A branded .pkg installs the app renamed and the profile
        run: |
          brand=$(mktemp -d)
          cp app/assets/app/anvil.png "$brand/icon.png"
          echo '{"profile_version": 1, "server": "https://voice.acme.example", "brand": {"app_name": "Acme Voice", "icon": "icon.png"}}' > "$brand/profile.json"
          pkg=$(python3 app/packaging/brand.py "$brand" --bundle dist/Anvil-${{ needs.version.outputs.label }}-macos.dmg \
            --version ${{ needs.version.outputs.version }} --label ${{ needs.version.outputs.label }} --out "$RUNNER_TEMP/branded" | tail -1)
          test "$(basename "$pkg")" = "Acme-Voice-${{ needs.version.outputs.label }}-macos.pkg"
          sudo installer -pkg "$pkg" -target /
          app="/Applications/Acme Voice.app"
          plist="$app/Contents/Info.plist"
          [ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleName' "$plist")" = "Acme Voice" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$plist")" = "Acme Voice" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$plist")" = "com.thevoiceguy.anvil" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIconFile' "$plist")" = "Brand" ]
          ! /usr/libexec/PlistBuddy -c 'Print CFBundleIconName' "$plist" 2>/dev/null
          test -s "$app/Contents/Resources/Brand.icns"
          codesign --verify --deep "$app"
          test -f "/Library/Application Support/Anvil/profile/profile.json"
          test -f "/Library/Application Support/Anvil/profile/icon.png"
          "$app/Contents/MacOS/Anvil" & pid=$!
          sleep 10
          kill -0 $pid || { echo "::error::the branded app exited"; exit 1; }
          kill $pid
      - uses: actions/upload-artifact@v4
        with:
          name: release-app-macos
          path: dist/

  publish:
    name: Publish the release
    needs: [version, cli-windows, app-linux, app-windows, app-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      # latest.json, which the app updates from (crates/anvil-update), signed
      # with the ANVIL_UPDATE_KEY secret on a tag and checked against the
      # public key the app has built in. Elsewhere a throwaway key proves the
      # same steps.
      - name: The update manifest, signed
        env:
          UPDATE_KEY: ${{ secrets.ANVIL_UPDATE_KEY }}
        run: |
          app/packaging/manifest.py ${{ needs.version.outputs.version }} \
            "${{ needs.version.outputs.label }}" "$GITHUB_REPOSITORY" dist
          key=$(mktemp)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ -z "$UPDATE_KEY" ]; then
              echo "::error::the ANVIL_UPDATE_KEY secret is not set"
              exit 1
            fi
            printf '%s\n' "$UPDATE_KEY" > "$key"
            public=app/packaging/update-key.pub.pem
          else
            openssl genpkey -algorithm ed25519 -out "$key"
            public=$(mktemp)
            openssl pkey -in "$key" -pubout -out "$public"
          fi
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/latest.json -out dist/latest.json.sig
          rm -f "$key"
          openssl pkeyutl -verify -pubin -inkey "$public" -rawin \
            -in dist/latest.json -sigfile dist/latest.json.sig
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Anvil $GITHUB_REF_NAME" --notes-file - <<NOTES
          The Anvil app for Windows, macOS and Linux, and anvil-cli for Windows.

          - **Windows**: \`Anvil-$GITHUB_REF_NAME-windows-x86_64-setup.exe\` installs for you alone, no administrator needed.
          - **macOS**: open \`Anvil-$GITHUB_REF_NAME-macos.dmg\` and drag Anvil to Applications (Apple Silicon and Intel).
          - **Linux**: \`anvil_${GITHUB_REF_NAME}_amd64.deb\` for Debian and Ubuntu, or \`Anvil-$GITHUB_REF_NAME-x86_64.AppImage\` to run in place (a tray needs an AppIndicator host).
          - **anvil-cli** for Windows: unzip and run \`anvil-cli.exe login https://your-fcp-server\`.

          Nothing is code-signed yet: Windows SmartScreen asks before the first run, and macOS needs a right-click → Open the first time. Check downloads against \`SHA256SUMS\`.
          NOTES
