name: App

# The Flutter app (`app/`, docs/APP.md): analysed and its widget tests run;
# its generated bindings checked against the Rust API; its golden
# screenshots compared on all three desktops; built for Windows,
# macOS and Linux, its integration test run on each, and each build kept as
# the run's artifact; built for Android and iOS, its mobile integration test
# run in an emulator and a simulator.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: "3.47.6"
  FRB_VERSION: "2.13.0"

jobs:
  checks:
    name: analyze, widget tests, bindings
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: What differed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-linux
          path: app/test/goldens/failures
          if-no-files-found: ignore
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The generator
        working-directory: .
        run: |
          if ! flutter_rust_bridge_codegen --version 2>/dev/null | grep -q "$FRB_VERSION"; then
            cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --locked
          fi
      - name: The bindings match the Rust API
        run: |
          sudo apt-get update && sudo apt-get install -y libasound2-dev
          flutter_rust_bridge_codegen generate
          git diff --exit-code -- lib/src/rust rust/src/frb_generated.rs

  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, target: linux, out: build/linux/x64/release/bundle }
          - { name: Windows, os: windows-latest, target: windows, out: build/windows/x64/runner/Release }
          - { name: macOS, os: macos-latest, target: macos, out: build/macos/Build/Products/Release }
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> app/build"
      - name: Linux build tools
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libayatana-appindicator3-dev xvfb
      - run: flutter pub get
      # One set of goldens, made on Linux, holds here too (the checks job
      # runs them on Linux).
      - name: The screens look the same as on Linux
        if: matrix.target != 'linux'
        run: flutter test test/goldens
      - name: What differed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-${{ matrix.target }}
          path: app/test/goldens/failures
          if-no-files-found: ignore
      - run: flutter build ${{ matrix.target }} --release
      - name: The app starts with its Rust core
        # A hang (a system prompt nobody answers) fails, not waits six hours.
        timeout-minutes: 20
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = linux ]; then
            xvfb-run -a flutter test integration_test/app_test.dart -d linux
          else
            flutter test integration_test/app_test.dart -d ${{ matrix.target }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: anvil-app-${{ matrix.target }}
          path: app/${{ matrix.out }}

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      # Four ABIs of the Rust core, then an emulator: more than the runner's
      # free disk without what Android doesn't need.
      - name: Free disk space
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> app/build"
      - run: flutter pub get
      # Signed with the debug key until the app has an upload key (U5).
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: anvil-app-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
      # The emulator's debug build needs only its own ABI; the release
      # build's four go.
      - run: rm -rf build
      - name: The emulator may use KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The app starts with its Rust core on a phone
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: app
          script: flutter test integration_test/mobile_test.dart -d emulator-5554

  ios:
    name: iOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> app/build"
      - run: flutter pub get
      # Unsigned until there is an Apple Developer account (U3c, U5).
      - name: flutter build ios --release --no-codesign
        # Flutter hides Xcode's errors behind a generic message; the verbose
        # log has them.
        run: |
          if ! flutter build ios --release --no-codesign -v > ios-build.log 2>&1; then
            # Cargokit's own lines (the Rust build), then Xcode's errors.
            grep "SEVERE" ios-build.log | grep -vE "Compiling|Downloaded|Checking" | head -200
            grep -nE "error:|\*\* BUILD FAILED" ios-build.log | head -40
            exit 1
          fi
      - name: The iOS build's log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: app/ios-build.log
          if-no-files-found: ignore
      - name: A simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "iOS" in runtime:
                  for d in devices:
                      if d["name"].startswith("iPhone"):
                          print(d["udid"]); sys.exit()
          sys.exit("no iPhone simulator")')
          xcrun simctl boot "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: The app starts with its Rust core on a phone
        timeout-minutes: 30
        run: flutter test integration_test/mobile_test.dart -d ${{ steps.sim.outputs.udid }}
